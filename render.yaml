services:
  - type: web
    name: siga-e-academic
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: corepack enable && corepack prepare pnpm@12.10.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @siga-e/web build && pnpm --filter @siga-e/api build
    startCommand: pnpm --filter @siga-e/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SIGAE_M1_RENDER_ENABLED
        value: "true"
      - key: M1_WRITES_ENABLED
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false

databases:
  - name: siga-e-academic-db
    databaseName: sigae_academic
    user: sigae_migrator
    plan: 0.5c-1g
    region: oregon
